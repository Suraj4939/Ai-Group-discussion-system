<!DOCTYPE html>
<html>

<head>

    <title>AI Group Discussion System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>AI Group Discussion Practice System</h1>

    <div class="form-box">

        <input type="text"
               id="topic"
               placeholder="Enter GD Topic">

        <textarea id="message"
                  placeholder="Enter your opinion"></textarea>

        <button onclick="startDiscussion()">
            Start Discussion
        </button>

    </div>

    <div class="result-box">

        <div class="card">
            <h2>Supportive Agent</h2>
            <p id="supportive"></p>
        </div>

        <div class="card">
            <h2>Opponent Agent</h2>
            <p id="opponent"></p>
        </div>

        <div class="card">
            <h2>Moderator Agent</h2>
            <p id="moderator"></p>
        </div>

        <div class="feedback">

            <h2>Feedback</h2>

            <p id="prediction"></p>

            <p id="sentiment"></p>

            <p id="confidence"></p>

            <p id="grammar"></p>

        </div>

    </div>

</div>

<script src="{{ url_for('static',
filename='app.js') }}"></script>

</body>
</html>
